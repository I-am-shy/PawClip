name: Release

# 按 docs/DESIGN.md §14 第 21 条：macOS 出通用二进制，Windows 出 NSIS 安装包；
# 路径按 §10 的目录结构表定为 `.github/workflows/release.yml`。
#
# 触发方式：推一个 `v*` 的 tag。手工 `workflow_dispatch` 也留着——
# tag 打错位置、或者只想重跑一次构建时，不必删 tag 再打一遍
# （删 tag 会连带把已经发出的 Release 一起弄丢）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 发 Release 要写仓库内容（创建 / 更新 Release、上传附件）。
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不牵连同批的另一个：用户可能只要 mac 版，
      # 而 Windows runner 上的偶发网络失败不该让 mac 的包也发不出去。
      fail-fast: false
      matrix:
        include:
          # 单个 macos-14 runner 上直接出 arm64 + x86_64 的通用二进制。
          # §14 第 21 条给了两条路（两个 runner 分别构建 / 一个 runner 出
          # universal），这里选后者：产物只有一份，"用户该下哪个"这个问题
          # 就不存在了。
          #
          # 注意 macos-14 是 arm64，出 universal 意味着 cgo 要走
          # `-arch arm64 -arch x86_64` 双架构链接（wails 会设好 CGO_CFLAGS，
          # Xcode 的 clang 支持多 -arch）。若某天这条链断了，退路是按
          # §14 第 21 条的前半句拆成 macos-14 + macos-13 两个 job，
          # 各自出单架构包。
          - os: macos-14
            label: macOS universal
            platform: darwin/universal
            artifact: PawClip-macos-universal
          - os: windows-2022
            label: Windows amd64
            platform: windows/amd64
            artifact: PawClip-windows-amd64
            nsis: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 钉死 wails 版本，与本地开发用的版本保持一致。
      #
      # `@latest` 在这里是个陷阱：wails 的小版本会改打包行为
      # （模板变量、Info.plist 合并规则、NSIS 脚本），于是"本地能出包、
      # CI 出包不一样"这种问题会以最难查的方式出现——产物能生成，
      # 只是某个字段丢了。升级 wails 应当是一次**显式的改动**，
      # 而不是某次 CI 自己顺手做的。
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # wails 的 `-nsis` 走 makensis。
      #
      # ⚠️ 装完必须自己把它加进 PATH。`choco install` 只改注册表里的环境变量，
      # **不会**传播给已经启动的 runner 进程，于是本 job 后续步骤的 PATH 里
      # 仍然没有 NSIS；而 wails 是用 `exec.LookPath("makensis")` 找它的
      # （internal/shell/shell.go:95），找不到时**只打一行 Warning 就 return nil**
      # （pkg/commands/build/nsis_installer.go:53）——Build 步骤照样绿，
      # 安装包却压根没生成，直到打包步骤才以一句 "exit code 1" 炸出来。
      # 2026-09-18 首次发 v0.1.0 就是这么失败的（macOS 全绿，只有 Windows 红）。
      #
      # 下面那句 `makensis -VERSION` 是**故意**留的：宁可在这里明确失败，
      # 也不要把问题推迟到打包步骤那个看不出所以然的地方。
      - name: Install NSIS
        if: matrix.nsis == 'true'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            Write-Error "NSIS 没有装到预期位置：$nsisDir"
            exit 1
          }
          echo $nsisDir >> $env:GITHUB_PATH
          & "$nsisDir\makensis.exe" -VERSION

      - name: Build
        # 走 scripts/build.sh 而不是直接调 wails：那个脚本是"唯一正确的构建
        # 方式"，它钉死了两件在这里重复写一遍就会漂移的事——
        #   ① `-tags sqlite_fts5`。缺了它 FTS5 会在正式产物里**静默失效**
        #      （退回 LIKE 检索，只打一行 WARN），而这是发出去的包，
        #      没人会去看日志。
        #   ② 版本号注入。版本号的唯一真源是 wails.json 的 productVersion，
        #      由脚本用 -ldflags 注入 Go 侧；不注入的话发布包会报出开发占位符。
        #
        # VERSION 用 tag 号（去掉前缀 v）覆盖，这样用户报问题时报的就是他
        # 下载的那个 tag。手工 workflow_dispatch 时没有 tag，表达式给空串，
        # build.sh 会用 `${VERSION:-...}` 退回 wails.json 的值。
        #
        # CGO_ENABLED=1 显式写出来：go-sqlite3 是 cgo 包，
        # 而 CI 环境里任何一步设了 CGO_ENABLED=0 都会让产物退化成空桩驱动。
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        # shell 必须显式写成 bash。
        #
        # Windows runner 的默认 shell 是 pwsh，而 pwsh 遇到 `.sh` 会经由文件关联
        # **异步**启动解释器，退出码不会回到 pwsh（`$LASTEXITCODE` 不被设置），
        # 于是 GitHub 认为这一步成功——**构建失败时 Build 步骤照样报绿**，
        # 问题被推迟到打包步骤，以一句没有上下文的 "exit code 1" 出现。
        # 2026-09-18 发 v0.1.0 时 Windows 就是这个形态（macOS 一直正常，
        # 因为它的默认 shell 本来就是 bash，退出码能正确传播）。
        # bash 在三个平台上都有，写死它这个歧义就消失了。
        shell: bash
        run: scripts/build.sh -platform ${{ matrix.platform }} ${{ matrix.nsis == 'true' && '-nsis' || '' }}

      # ── macOS：ad-hoc 签名 ────────────────────────────────────
      #
      # §14 第 18 条：Apple Silicon 上内核直接拒绝执行未签名的 App。
      # 链接出的可执行文件自带 ad-hoc 签名，但 **.app 包本身要显式签**。
      #
      # 这里的 `--sign -` 是 ad-hoc（无证书）。副作用是 cdhash 每次构建都变，
      # macOS 会把每个新构建当成另一个 App，于是 TCC 的辅助功能授权要重给
      # ——这是**开发期**的麻烦，写在了 README 里；发布包给用户装的时候
      # 只需授权一次，所以这里不引入自签证书（§0 的前提是"不买证书"）。
      - name: Codesign (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/bin/PawClip.app"
          test -d "$APP" || { echo "没有找到 $APP —— 产物路径变了？"; exit 1; }
          codesign --sign - --force --deep "$APP"
          # 立刻验一次。签名失败的典型表现是"命令成功、包仍然不可用"，
          # 所以不能只看退出码。
          codesign --verify --verbose=2 "$APP"

      # 用 zip 而不是 dmg：dmg 需要额外工具链，而且对签名更敏感。
      # ditto 会保留 .app 里的符号链接、可执行位与扩展属性——
      # 普通的 `zip` 会丢掉可执行位，用户把包拖进 Applications 后打不开，
      # 而这个问题只在用户机器上出现。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/bin/PawClip.app "${{ matrix.artifact }}.zip"
          ls -lh "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NSIS 安装包（wails 的输出名形如 PawClip-amd64-installer.exe）
          # 与免安装的 exe 一起发。有人就是不想装东西。
          #
          # 失败时的诊断信息要够用：这条路径上最常见的坏法是 makensis 不在
          # PATH，而 wails 对此**是静默的**（只打 Warning），所以只报一句
          # "没生成"没法定位。把 build/bin 的实际内容打出来，一眼就能分辨
          # "完全没有 exe"还是"只有裸 exe、缺 installer"——两者根因不同。
          $installer = Get-ChildItem build/bin -Filter "*-installer.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Host "build/bin 的实际内容："
            Get-ChildItem build/bin -Recurse | Select-Object FullName, Length
            Write-Error "没有生成 NSIS 安装包（先确认 makensis 真的可用）"
            exit 1
          }
          if (-not (Test-Path build/bin/PawClip.exe)) {
            Write-Host "build/bin 的实际内容："
            Get-ChildItem build/bin -Recurse | Select-Object FullName, Length
            Write-Error "没有找到 build/bin/PawClip.exe"
            exit 1
          }
          Copy-Item $installer.FullName "${{ matrix.artifact }}-installer.exe"
          Copy-Item build/bin/PawClip.exe "${{ matrix.artifact }}.exe"
          Get-ChildItem "${{ matrix.artifact }}*" | Select-Object Name, Length

      # ── 诊断（仅 Windows）─────────────────────────────────────
      #
      # 为什么要把事实做成 annotation、而不是留在日志里：失败步骤的日志需要
      # 仓库 admin 权限才能取（API 与网页都拿不到），而 check-run 的
      # annotations 是**公开可读**的。把定位所需的现场信息用 `::notice::`
      # 发出去，就能在不登录的情况下看到"构建到底产出了什么"。
      #
      # 同时它也是个断言：产物缺失时用 `::error::` 明确失败，把
      # "静默假绿" 变成 "在正确的位置报错"。
      #
      # 定位完成后这个步骤可以删掉。
      - name: Diagnose (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $mk = (Get-Command makensis -EA SilentlyContinue).Source
          $binDir = "build/bin"
          $instDir = "build/windows/installer"
          $bin = if (Test-Path $binDir) { ((Get-ChildItem $binDir -Recurse -File -EA SilentlyContinue | Select-Object -First 12 | ForEach-Object Name) -join ",") } else { "NO-DIR" }
          $inst = if (Test-Path $instDir) { ((Get-ChildItem $instDir -Recurse -File -EA SilentlyContinue | Select-Object -First 12 | ForEach-Object Name) -join ",") } else { "NO-DIR" }
          Write-Host "::notice title=NSIS-DIAG::makensis=[$mk]; buildbin=[$bin]; installer=[$inst]"
          if (-not (Test-Path "$binDir/PawClip.exe")) {
            Write-Host "::error title=NSIS-DIAG::build/bin 里没有 PawClip.exe —— Windows 构建没有真正产出"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}*.exe

  # 把两个平台的产物合并到同一个 Release。
  #
  # 单独一个 job 而不是在 build 里各自上传，是因为并行 job 同时创建同一个
  # Release 会互相打架（谁先创建、谁覆盖谁的附件）。这里等全部构建完了
  # 一次性发，顺序是确定的。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 正文里给出 §14 第 19/20 条要求的两条"下载后怎么办"：
          # 这是用户唯一会看的地方，写在 README 里等于没写。
          body: |
            ## 下载

            | 平台 | 文件 |
            |---|---|
            | macOS（Apple Silicon + Intel） | `PawClip-macos-universal.zip` |
            | Windows（安装版） | `PawClip-windows-amd64-installer.exe` |
            | Windows（免安装） | `PawClip-windows-amd64.exe` |

            ## 首次打开

            **macOS**：本包未做 Apple 公证（无签名分发，见 docs/DESIGN.md §14 F），
            Gatekeeper 会拦一次。执行下面这行，或在「系统设置 → 隐私与安全性」
            里点「仍要打开」：

            ```sh
            xattr -dr com.apple.quarantine /Applications/PawClip.app
            ```

            要自动粘贴还需授权：**系统设置 → 隐私与安全性 → 辅助功能** 里勾选 PawClip。

            **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」。
          fail_on_unmatched_files: true
