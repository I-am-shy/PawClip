name: CI

# 每次推分支 / 提 PR 都跑一遍。目的只有两个：
#
#   ① 让"绿"这件事有第三方证据 —— 本地 `go test ./...` 通过之后，
#      提交、推送、CI 上仍然绿，才算真的通过。
#   ② 拦住"只在某一种平台上能编过"的改动。这个项目里这类风险是实打实的：
#      panel / clipboard / reveal / autostart 全都是按平台分文件的
#      （`//go:build darwin` 等），本机是 macOS 的话，Windows 分支的编译错误
#      只有到 CI（或真机）才会暴露。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # 打 tag 走 release.yml，不重复跑
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消上一次仍在跑的 CI。
# 不是为了省资源，是为了让"最后一次提交的结果"尽快出现在页面上——
# 多个 run 同时排队时，人容易看错哪一个才是当前提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 后端：全量测试 ────────────────────────────────────────────
  #
  # ⚠️ 这个 job 必须跑在 **macOS** 上，不要省事改回 ubuntu-latest。
  #
  # 理由：本仓库是 macOS 应用，DESIGN.md §12 的延迟指标（文本捕获 p95 < 30ms、
  # 5MB 图片 < 200ms、10 万条检索 < 50ms @10 万条）都是**目标平台**的指标。
  # 把它们放到共享的 Linux runner 上量，量到的不是产品性能，而是"这台共享
  # 机器有多慢"：ubuntu-latest 是 2 vCPU，相对 Apple Silicon 约慢 2 倍，而
  # 三条里余量最小的是图片那条（本机中位数 115ms / 预算 200ms，只有 1.7 倍），
  # 必然被击穿——2026-09-18 首次推送时就是这么红的（job 耗时 2m0s，
  # 本地同一条命令 53s）。判据不是"能不能跑"，是"在哪儿量才有意义"。
  #
  # 这不算放松要求：Linux/Windows 分支代码的看护由下面的 compile-check
  # 继续承担（那条只证明"能编过"，与运行性能无关），并没有失去覆盖。
  #
  # 复现/排查这类"本地绿、CI 红"时，先对齐口径：CI 跑的是不带 `-short` 的
  # 全量，而 `test/run.sh --short` 会跳过 3 个规模测试——两者的范围不一样。
  go-test:
    name: Go tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 唯一真源是 go.mod，不在这里再写一遍版本号：
          # 两处各写一份的结果是"本地 1.26 能过、CI 用 1.24 过不了"，
          # 或者反过来（CI 悄悄升级了而本地没升）。
          go-version-file: go.mod
          cache: true

      # `-tags sqlite_fts5` 不能省：不带它编译出的二进制里没有 fts5 模块，
      # 而 store.Open 对此是**优雅降级**（打一行 WARN、退回 LIKE 检索），
      # 于是测试会"跳过"一批全文检索用例而不是变红。
      # 同一个纪律在 scripts/build.sh 里也钉了一遍，理由见那个文件。
      #
      # `-p 1` 也不能省：本仓库有两类**按墙上时间取证**的规模测试
      # （store 的 10 万条检索延迟、capture 的捕获延迟）。go test 默认并行
      # 跑包，CPU 被 9 个包抢满时，这些数字会飙到 2~3 倍——那是机器被占满，
      # 不是产品退化。串行跑让度量条件稳定，代价是总耗时基本不变
      # （互相抢 CPU 本来也在拖慢彼此）。
      - name: go test
        run: go test -tags sqlite_fts5 -p 1 -count=1 ./...

      # 带上 sqlite_fts5：不带的话，只有该标签下才编译的那些文件
      # （FTS5 相关的迁移与自检）根本进不了 vet 的视野——一次静默的范围缩水。
      # 这条与 test/run.sh 里的第 ② 层完全一致。
      - name: go vet
        run: go vet -tags sqlite_fts5 ./...

  # ── 后端：跨平台编译烟测 ──────────────────────────────────────
  #
  # ⚠️ 这一条**只证明"能编过"**，不证明 Windows / Linux 版能跑。
  #
  # 原因：mattn/go-sqlite3 在 `CGO_ENABLED=0` 下会编译进一个空桩驱动
  # （static_mock.go），驱动名注册得上、但任何实际连接都会失败。
  # 也就是说这里的产物是"能链接、不能开库"的。
  #
  # 那为什么还要跑：本仓库有大量按平台分文件的代码，而**编译**是唯一能
  # 在没有真机的情况下检查它们的办法。真正的可运行产物由 release.yml
  # 在原生 runner（windows-2022 / macos-14，自带编译器和 cgo）上构建。
  compile-check:
    name: Compile check (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build (${{ matrix.goos }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        # ⚠️ 标签必须写在包路径**之前**。`go build ./... -tags x` 不是
        # "把标签传给构建"，而是把 `-tags` / `x` 当成两个**包路径**来解析，
        # 报的是 `malformed import path "-tags"` 与 `package x is not in std`。
        # （`go test` 对"包后面的参数"有兼容处理，所以同样写法在测试那一步
        # 能过——这个不对称正好是最容易被抄错的地方。）
        run: go build -tags sqlite_fts5 ./...

  # ── 前端：i18n 检查 + 类型检查 + 产物 ─────────────────────────
  #
  # ⚠️ windows-2022 那一格不是凑数。`frontend:build` 在**发布时是在 Windows
  # runner 上跑的**（release.yml 的 windows 矩阵项），而这一层的两个脚本
  # （`check-i18n.mjs` / `check-md.mjs`）都是"按路径读文件、按路径 import"的
  # node 脚本——**路径处理恰好是最容易只在 Windows 上坏掉的一类代码**。
  #
  # 2026-09-21 发 v0.1.1 就是这么炸的：`check-md.mjs` 用 `import(绝对路径)`
  # 加载 `md.ts`，POSIX 上合法、Windows 上抛 ERR_UNSUPPORTED_ESM_URL_SCHEME。
  # 当时跑 `npm run build` 的只有 ubuntu 这一格，于是 mac 全绿、Windows 红、
  # Release 被跳过，错误一路漏到打完 tag 才出现。补上这一格之后，同类问题
  # 在下一次 push 就会红，而不是在下一次发版。
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台红不牵连同批的另一个：要知道"是不是 Windows 独有"，
      # 恰恰需要两边的结论都在。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` 而不是 `npm install`：CI 要的是**可复现**。
      # install 会在 lockfile 与 package.json 不一致时悄悄改 lockfile，
      # 于是"CI 过了"可能只是因为 CI 自己升级了一个依赖。
      - run: npm ci

      # npm run build 的第一段就是 npm run check:i18n（test/check-i18n.mjs）：
      # 中途某次改动漏了一个键、或者两份字典对不上，这里会直接失败。
      # 放在构建最前面是为了让错误信息指向真正的问题（少了一个文案），
      # 而不是被 TS 的连锁报错淹没。
      - run: npm run build
